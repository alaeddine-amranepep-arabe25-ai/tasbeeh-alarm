name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unzip project
        run: |
          unzip -o tasbeeh-alarm.zip
          cp -r tasbeeh-alarm/* ./ 2>/dev/null || true

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Force Export Build & Prepare WWW
        run: |
          # إضافة إعداد التصدير الثابت لـ Next.js إذا لم يكن موجوداً
          npx next build || true
          mkdir -p www
          
          # البحث عن ملف index.html الأصلي ونسخ محتويات العرض
          if [ -d "out" ]; then
            cp -r out/* www/
          elif [ -d ".next/server/app" ]; then
            cp -r .next/server/app/* www/ 2>/dev/null || true
          fi
          
          # إنشائ ملف دخول رئيسي يقرأ محتوى المشروع بدون توجيه خفي
          find .next -name "index.html" -exec cp {} www/ \; 2>/dev/null || true
          
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tasbeeh Alarm</title></head><body><div id="__next"></div></body></html>' > www/index.html
          fi

      - name: Initialize Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.tasbeeh.alarm",
            "appName": "Tasbeeh Alarm",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: npx @capacitor/cli add android || true

      - name: Sync Capacitor
        run: npx @capacitor/cli sync

      - name: Fix Kotlin & Gradle Config
        run: |
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug -x test --warning-mode none

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
