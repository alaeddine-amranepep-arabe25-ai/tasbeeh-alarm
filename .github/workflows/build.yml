name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip project
        run: |
          unzip -o tasbeeh-alarm.zip
          cp -r tasbeeh-alarm/* ./ 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build || true

      - name: Create www directory & HTML entry
        run: |
          mkdir -p www
          if [ -d "out" ]; then cp -r out/* www/; fi
          if [ -d ".next" ]; then cp -r .next/* www/; fi
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><script>window.location.href="./server/pages/index.html";</script></head><body></body></html>' > www/index.html
          fi

      - name: Initialize Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.tasbeeh.alarm",
            "appName": "Tasbeeh Alarm",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        run: npx @capacitor/cli add android || true

      - name: Sync Capacitor
        run: npx @capacitor/cli sync

      - name: Fix Kotlin Dependencies
        run: |
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug -x test --warning-mode none

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
